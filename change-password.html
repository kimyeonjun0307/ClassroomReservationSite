<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 변경 · 동서대학교 공간 예약 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #B91C1C;
    --primary-dark: #7F1010;
    --primary-light: #D64545;
    --gray-900: #1A1D23; --gray-700: #454B54; --gray-500: #767D89;
    --gray-300: #D8DCE2; --gray-200: #E7E9ED; --gray-100: #F1F3F6; --gray-50: #F8F9FB;
    --danger: #C13A3A; --success: #12805C;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--gray-50); color: var(--gray-900);
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; max-width: 360px; background: #fff; border-radius: 20px; padding: 36px 32px; box-shadow: 0 8px 24px rgba(139,20,20,0.10); }
  .kicker { font-size: 12px; font-weight: 700; color: var(--primary); letter-spacing: 0.4px; margin-bottom: 10px; }
  h2 { font-size: 21px; font-weight: 700; margin: 0 0 8px; }
  .sub { font-size: 13.5px; color: var(--gray-500); margin: 0 0 24px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--gray-700); margin-bottom: 7px; }
  .field input {
    width: 100%; height: 44px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
    padding: 0 14px; font-size: 14px; font-family: inherit; background: var(--gray-50); color: var(--gray-900);
  }
  .field input:focus { outline: none; border-color: var(--primary-light); background: #fff; }
  .btn { width: 100%; height: 46px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 6px; }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .form-msg { font-size: 12.5px; margin: -6px 0 14px; line-height: 1.6; }
  .form-msg.error { color: var(--danger); }
  .form-msg.success { color: var(--success); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <div class="kicker">SPACE RESERVATION</div>
  <h2>비밀번호를 변경해주세요</h2>
  <p class="sub">첫 로그인이거나 관리자가 초기화한 계정이에요. 계속 이용하려면 새 비밀번호를 설정해주세요.</p>

  <div id="msg" class="form-msg hidden"></div>

  <form id="changeForm">
    <div class="field">
      <label for="newPw">새 비밀번호</label>
      <input type="password" id="newPw" placeholder="6자 이상 입력하세요" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="field">
      <label for="newPw2">새 비밀번호 확인</label>
      <input type="password" id="newPw2" placeholder="다시 한 번 입력하세요" autocomplete="new-password" minlength="6" required>
    </div>
    <button type="submit" class="btn" id="btnChange">비밀번호 변경</button>
  </form>
</div>

<script>
  var SUPABASE_URL = 'https://yclrlgcixldovbhygjrc.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbHJsZ2NpeGxkb3ZiaHlnanJjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzI2NTUsImV4cCI6MjEwMjI0ODY1NX0.hk2FB9D45QcGxFXPeNwNENcBusuOnLeakKNqA3gFtmo';
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var ROLE_REDIRECT = {
    assistant: 'index.html',
    mid_admin: 'manager.html',
    final_admin: 'admin.html'
  };

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'form-msg ' + type;
    el.classList.remove('hidden');
  }

  (async function requireLogin() {
    var sessionRes = await supabase.auth.getSession();
    if (!sessionRes.data.session) {
      window.location.href = 'login.html';
    }
  })();

  document.getElementById('changeForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('btnChange');
    var pw1 = document.getElementById('newPw').value;
    var pw2 = document.getElementById('newPw2').value;

    if (pw1.length < 6) { showMsg('비밀번호는 6자 이상이어야 해요.', 'error'); return; }
    if (pw1 !== pw2) { showMsg('두 비밀번호가 서로 달라요.', 'error'); return; }

    btn.disabled = true;

    var updateRes = await supabase.auth.updateUser({ password: pw1 });
    if (updateRes.error) {
      showMsg('비밀번호 변경에 실패했습니다: ' + updateRes.error.message, 'error');
      btn.disabled = false;
      return;
    }

    var sessionRes = await supabase.auth.getSession();
    var userId = sessionRes.data.session.user.id;

    var flagRes = await supabase.from('users').update({ must_change_password: false }).eq('id', userId);
    if (flagRes.error) {
      showMsg('비밀번호는 변경됐지만 상태 갱신에 실패했습니다: ' + flagRes.error.message, 'error');
      btn.disabled = false;
      return;
    }

    var profileRes = await supabase.from('users').select('role').eq('id', userId).single();
    window.location.href = (profileRes.data && ROLE_REDIRECT[profileRes.data.role]) || 'index.html';
  });
</script>

</body>
</html>
