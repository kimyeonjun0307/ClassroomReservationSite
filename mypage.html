<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마이페이지 · 동서대학교 공간 예약 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root {
    --primary: #B91C1C; --primary-dark: #7F1010; --primary-light: #D64545;
    --accent-bg: #FBEAEA; --accent-text: #8A1616;
    --success: #12805C; --success-bg: #E6F6EF; --success-border: #7FD1AC;
    --warning: #B7791F; --warning-bg: #FDF3E2; --warning-border: #F0CE8C;
    --danger: #C13A3A; --danger-bg: #FCEBEB; --danger-border: #F0AFAF;
    --gray-900: #1A1D23; --gray-700: #454B54; --gray-500: #767D89;
    --gray-300: #D8DCE2; --gray-200: #E7E9ED; --gray-100: #F1F3F6; --gray-50: #F8F9FB;
    --border: #E4E7EC;
    --shadow-sm: 0 1px 3px rgba(16,24,40,0.06);
    --shadow-md: 0 6px 20px rgba(16,24,40,0.09);
    --radius-md: 14px; --radius-lg: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
  }

  header {
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 36px;
  }
  header .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 9px; letter-spacing: -0.2px; }
  header .user-info { display: flex; align-items: center; gap: 13px; font-size: 14px; color: rgba(255,255,255,0.85); }
  header .user-info .divider { opacity: 0.4; }
  header .user-info .logout { cursor: pointer; transition: opacity .12s; }
  header .user-info .logout:hover { opacity: 0.75; }

  main { max-width: 1400px; margin: 0 auto; padding: 44px 32px; }

  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.4px; }
  .subtitle { color: var(--gray-500); font-size: 14.5px; margin-bottom: 30px; }

  .summary-cards { display: flex; gap: 18px; margin-bottom: 32px; }
  .card {
    flex: 1; background: #fff; border-radius: var(--radius-lg); padding: 22px 22px;
    display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-sm);
  }
  .icon-circle {
    width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0; color: #fff;
  }
  .icon-approved { background: var(--success); }
  .icon-pending { background: var(--warning); }
  .icon-rejected { background: var(--danger); }
  .icon-done { background: #5B5FEA; }

  .card-label { font-size: 13.5px; color: var(--gray-500); margin-bottom: 4px; font-weight: 500; }
  .card-count { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }

  table {
    width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  thead { background: var(--gray-50); }
  th { text-align: center; padding: 15px 12px; font-size: 13px; font-weight: 700; color: var(--gray-700); border-bottom: 1px solid var(--border); }
  td { text-align: center; padding: 17px 14px; font-size: 13.5px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  td.space-name { font-weight: 700; color: var(--gray-900); }
  td.reason { text-align: left; }
  td.reason .warn { color: var(--danger); }

  .status { display: inline-block; padding: 6px 14px; border-radius: 100px; font-size: 12.5px; font-weight: 700; }
  .status-pending { background: var(--warning-bg); color: var(--warning); }
  .status-approved { background: var(--success-bg); color: var(--success); }
  .status-rejected { background: var(--danger-bg); color: var(--danger); }
  .status-done { background: var(--gray-100); color: var(--gray-500); }
  .status-canceled { background: var(--gray-100); color: var(--gray-500); }

  .btn-cancel {
    background: #fff; border: 1.5px solid var(--danger-border); color: var(--danger);
    font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: background .12s;
  }
  .btn-cancel:hover { background: var(--danger-bg); }
  .cell-canceled { color: var(--gray-300); font-size: 13px; }
  .cell-dash { color: var(--gray-300); }

  .logo { cursor: pointer; }

  .card { cursor: pointer; border: 2px solid transparent; transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .card.active { border-color: var(--primary); }

  .filter-banner {
    display: none; align-items: center; justify-content: space-between;
    background: var(--accent-bg); border: 1px solid #C7DAF2; color: var(--accent-text);
    border-radius: var(--radius-md); padding: 13px 20px; margin-bottom: 20px; font-size: 13.5px;
  }
  .filter-banner.show { display: flex; }
  .filter-banner button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  tr.hidden-row { display: none; }
  .empty-row td { padding: 44px; color: var(--gray-300); font-size: 14px; }

  .profile-card {
    background: #fff; border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 32px;
    box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 28px;
  }
  .profile-avatar {
    width: 70px; height: 70px; border-radius: 20px; background: var(--primary); color: #fff;
    font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .profile-main { flex: 1; }
  .profile-name-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .profile-name { font-size: 19px; font-weight: 700; color: var(--gray-900); letter-spacing: -0.3px; }
  .profile-role-badge { background: var(--accent-bg); color: var(--accent-text); font-size: 11.5px; font-weight: 700; padding: 3px 11px; border-radius: 100px; }
  .profile-dept { color: var(--gray-500); font-size: 13.5px; margin-bottom: 16px; }
  .profile-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px 32px; }
  .detail-item { display: flex; flex-direction: column; gap: 3px; }
  .detail-label { font-size: 11.5px; color: var(--gray-300); }
  .detail-value { font-size: 13.5px; color: var(--gray-700); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .pw-toggle { background: none; border: none; color: var(--primary); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
  .profile-edit-btn {
    align-self: flex-start; background: #fff; border: 1.5px solid var(--gray-200); color: var(--gray-700);
    padding: 9px 17px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; flex-shrink: 0; transition: all .12s;
  }
  .profile-edit-btn:hover { background: var(--gray-50); border-color: var(--primary-light); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(90,15,15,.5);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: var(--radius-lg); padding: 26px; width: 380px; max-width: 100%; box-shadow: var(--shadow-md); }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
  .modal-desc { font-size: 12.5px; color: var(--gray-500); line-height: 1.6; margin-bottom: 18px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--gray-700); margin-bottom: 7px; }
  .modal-field input {
    width: 100%; height: 40px; border: 1.5px solid var(--gray-200); border-radius: 10px;
    padding: 0 12px; font-size: 13px; font-family: inherit; background: var(--gray-50); color: var(--gray-900);
  }
  .modal-field input:focus { outline: none; border-color: var(--primary-light); background: #fff; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-btn-cancel, .modal-btn-confirm { flex: 1; height: 42px; border-radius: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; border: none; }
  .modal-btn-cancel { background: #fff; border: 1.5px solid var(--gray-200); color: var(--gray-700); }
  .modal-btn-confirm { background: var(--primary); color: #fff; }
  .modal-error { color: var(--danger); font-size: 12px; margin-top: -6px; margin-bottom: 10px; display: none; }
  .modal-error.show { display: block; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="mainback()">🏫 동서대학교 강의실 예약</div>
  <div class="user-info">
    <span id="headerUserLabel">👤 -</span>
    <span class="divider">|</span>
    <span class="logout" id="logoutBtn">로그아웃</span>
  </div>
</header>

<main>
  <h1>마이페이지</h1>
  <p class="subtitle">나의 공간 대여 현황 및 승인 결과를 확인하실 수 있습니다.</p>

  <div class="profile-card">
    <div class="profile-main">
      <div class="profile-name-row">
        <span class="profile-name" id="profileName">-</span>
      </div>
      <div class="profile-dept" id="profileJoined">-</div>
      <div class="profile-details">
        <div class="detail-item">
          <span class="detail-label">이메일</span>
          <span class="detail-value" id="profileEmail">-</span>
        </div>
      </div>
    </div>
    <button type="button" class="profile-edit-btn" id="openEditProfileBtn">회원정보 수정</button>
  </div>

  <div class="summary-cards">
    <div class="card" id="card-approved" onclick="filterByStatus('approved', '승인 완료')">
      <div class="icon-circle icon-approved">✓</div>
      <div>
        <div class="card-label">승인 완료</div>
        <div class="card-count" id="count-approved">0건</div>
      </div>
    </div>
    <div class="card" id="card-pending" onclick="filterByStatus('pending', '승인 대기')">
      <div class="icon-circle icon-pending">🕐</div>
      <div>
        <div class="card-label">승인 대기</div>
        <div class="card-count" id="count-pending">0건</div>
      </div>
    </div>
    <div class="card" id="card-rejected" onclick="filterByStatus('rejected', '승인 거절')">
      <div class="icon-circle icon-rejected">✕</div>
      <div>
        <div class="card-label">승인 거절</div>
        <div class="card-count" id="count-rejected">0건</div>
      </div>
    </div>
    <div class="card" id="card-done" onclick="filterByStatus('done', '이용 내역')">
      <div class="icon-circle icon-done">📁</div>
      <div>
        <div class="card-label">이용 내역</div>
        <div class="card-count" id="count-done">0건</div>
      </div>
    </div>
  </div>

  <div class="filter-banner" id="filterBanner">
    <span id="filterBannerText"></span>
    <button onclick="showAll()">전체 보기</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>신청일자</th>
        <th>예약 공간</th>
        <th>이용 일시</th>
        <th>대여 목적</th>
        <th>상태</th>
        <th>관리자 메모 / 거절 사유</th>
        <th>예약 취소</th>
      </tr>
    </thead>
    <tbody id="bookingsTbody">
    </tbody>
  </table>
</main>

<!-- 회원정보 수정 모달 -->
<div class="modal-overlay" id="editProfileModalOverlay">
  <div class="modal-box">
    <div class="modal-title">회원정보 수정</div>
    <div class="modal-desc">이름을 바꾸거나, 비밀번호를 새로 설정할 수 있습니다. 비밀번호는 바꾸고 싶을 때만 입력하세요.</div>
    <div class="modal-field">
      <label>이름</label>
      <input type="text" id="epName" placeholder="이름">
    </div>
    <div class="modal-field">
      <label>새 비밀번호 (선택)</label>
      <input type="password" id="epNewPassword" placeholder="6자 이상, 바꾸지 않으려면 비워두세요">
    </div>
    <div class="modal-error" id="epErrorBox"></div>
    <div class="modal-actions">
      <button type="button" class="modal-btn-cancel" id="epCancelBtn">취소</button>
      <button type="button" class="modal-btn-confirm" id="epSaveBtn">저장</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
  var STATUS_LABEL = {
    pending: '승인 대기', approved: '승인 완료', rejected: '승인 거절',
    cancelled: '취소됨', done: '이용 완료'
  };
  var bookingsCache = [];

  var cards = {
    approved: document.getElementById('card-approved'),
    pending: document.getElementById('card-pending'),
    rejected: document.getElementById('card-rejected'),
    done: document.getElementById('card-done')
  };
  var banner = document.getElementById('filterBanner');
  var bannerText = document.getElementById('filterBannerText');

  function clearActiveCards() { Object.keys(cards).forEach(function (k) { cards[k].classList.remove('active'); }); }

  function filterByStatus(status, label) {
    clearActiveCards();
    cards[status].classList.add('active');
    document.querySelectorAll('#bookingsTbody tr').forEach(function (row) {
      row.classList.toggle('hidden-row', row.getAttribute('data-status') !== status);
    });
    updateEmptyRow();
    banner.classList.add('show');
    bannerText.textContent = '"' + label + '" 상태의 내역만 보고 있습니다.';
  }
  window.filterByStatus = filterByStatus;

  function showAll() {
    clearActiveCards();
    document.querySelectorAll('#bookingsTbody tr').forEach(function (row) { row.classList.remove('hidden-row'); });
    updateEmptyRow();
    banner.classList.remove('show');
  }
  window.showAll = showAll;

  function updateEmptyRow() {
    var existing = document.getElementById('emptyRow');
    if (existing) existing.remove();
    var visible = Array.prototype.slice.call(document.querySelectorAll('#bookingsTbody tr:not(.hidden-row)'));
    if (visible.length === 0) {
      var tbody = document.getElementById('bookingsTbody');
      var tr = document.createElement('tr');
      tr.id = 'emptyRow';
      tr.className = 'empty-row';
      tr.innerHTML = '<td colspan="7">해당하는 내역이 없습니다.</td>';
      tbody.appendChild(tr);
    }
  }

  function mainback() { window.location.href = 'index.html'; }
  window.mainback = mainback;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDateTime(iso) { return iso.slice(0, 10); }

  async function loadBookings(userId) {
    var res = await supabaseClient
      .from('bookings')
      .select('id, date, start_time, end_time, purpose, status, review_comment, created_at, rooms(room_name)')
      .eq('requester_id', userId)
      .order('created_at', { ascending: false });
    if (res.error) { alert('예약 목록을 불러오지 못했습니다: ' + res.error.message); return; }
    bookingsCache = res.data || [];
    renderBookings();
  }

  function renderBookings() {
    var tbody = document.getElementById('bookingsTbody');
    tbody.innerHTML = '';
    var counts = { approved: 0, pending: 0, rejected: 0, done: 0 };

    bookingsCache.forEach(function (b) {
      if (counts[b.status] !== undefined) counts[b.status]++;

      var tr = document.createElement('tr');
      tr.setAttribute('data-status', b.status);
      tr.setAttribute('data-booking-id', b.id);

      var canCancel = (b.status === 'pending' || b.status === 'approved');
      var actionHtml = canCancel
        ? '<button type="button" class="btn-cancel" data-cancel-id="' + b.id + '">예약 취소</button>'
        : (b.status === 'cancelled' ? '<span class="cell-canceled">취소 완료</span>' : '<span class="cell-dash">-</span>');

      tr.innerHTML =
        '<td>' + formatDateTime(b.created_at) + '</td>' +
        '<td class="space-name">' + escapeHtml(b.rooms ? b.rooms.room_name : '-') + '</td>' +
        '<td>' + b.date + '<br>' + b.start_time.slice(0, 5) + '~' + b.end_time.slice(0, 5) + '</td>' +
        '<td>' + escapeHtml(b.purpose) + '</td>' +
        '<td><span class="status status-' + b.status + '">' + STATUS_LABEL[b.status] + '</span></td>' +
        '<td class="reason">' + (b.review_comment ? escapeHtml(b.review_comment) : '<span class="cell-dash">-</span>') + '</td>' +
        '<td>' + actionHtml + '</td>';
      tbody.appendChild(tr);
    });

    document.getElementById('count-approved').textContent = counts.approved + '건';
    document.getElementById('count-pending').textContent = counts.pending + '건';
    document.getElementById('count-rejected').textContent = counts.rejected + '건';
    document.getElementById('count-done').textContent = counts.done + '건';

    if (!document.querySelector('.card.active')) updateEmptyRow();
  }

  document.getElementById('bookingsTbody').addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-cancel-id]');
    if (!btn) return;
    var bookingId = btn.getAttribute('data-cancel-id');
    var row = btn.closest('tr');
    var spaceName = row.querySelector('.space-name').textContent.trim();
    var usage = row.cells[2].innerText.replace('\n', ' ');
    var ok = confirm('"' + spaceName + '" (' + usage + ') 예약을 취소하시겠습니까?\n취소한 예약은 되돌릴 수 없습니다.');
    if (!ok) return;

    var res = await supabaseClient.from('bookings').update({ status: 'cancelled' }).eq('id', bookingId);
    if (res.error) { alert('취소에 실패했습니다: ' + res.error.message); return; }

    var auth = await requireSession();
    if (auth) await loadBookings(auth.session.user.id);
  });

  var CURRENT_PROFILE = null;

  /* ---------- 회원정보 수정 ---------- */
  var editProfileModalOverlay = document.getElementById('editProfileModalOverlay');
  document.getElementById('openEditProfileBtn').addEventListener('click', function () {
    document.getElementById('epName').value = CURRENT_PROFILE ? CURRENT_PROFILE.name : '';
    document.getElementById('epNewPassword').value = '';
    document.getElementById('epErrorBox').classList.remove('show');
    editProfileModalOverlay.classList.add('show');
  });
  document.getElementById('epCancelBtn').addEventListener('click', function () { editProfileModalOverlay.classList.remove('show'); });
  editProfileModalOverlay.addEventListener('click', function (e) { if (e.target === editProfileModalOverlay) editProfileModalOverlay.classList.remove('show'); });

  document.getElementById('epSaveBtn').addEventListener('click', async function () {
    var errBox = document.getElementById('epErrorBox');
    var name = document.getElementById('epName').value.trim();
    var newPassword = document.getElementById('epNewPassword').value;

    if (!name) { errBox.textContent = '이름을 입력해주세요.'; errBox.classList.add('show'); return; }
    if (newPassword && newPassword.length < 6) { errBox.textContent = '비밀번호는 6자 이상이어야 합니다.'; errBox.classList.add('show'); return; }

    var nameRes = await supabaseClient.from('assistants').update({ name: name }).eq('id', CURRENT_PROFILE.id);
    if (nameRes.error) { errBox.textContent = '이름 저장 실패: ' + nameRes.error.message; errBox.classList.add('show'); return; }

    if (newPassword) {
      var pwRes = await supabaseClient.auth.updateUser({ password: newPassword });
      if (pwRes.error) { errBox.textContent = '비밀번호 변경 실패: ' + pwRes.error.message; errBox.classList.add('show'); return; }
    }

    CURRENT_PROFILE.name = name;
    document.getElementById('profileName').textContent = name;
    editProfileModalOverlay.classList.remove('show');
    alert('회원정보가 수정되었습니다.');
  });

  (async function init() {
    var auth = await requireRole(['assistant']);
    if (!auth) return;
    CURRENT_PROFILE = auth.profile;
    document.getElementById('profileName').textContent = auth.profile.name;
    document.getElementById('profileEmail').textContent = auth.session.user.email;
    document.getElementById('profileJoined').textContent = '가입일 ' + formatDateTime(auth.profile.created_at);
    document.getElementById('logoutBtn').addEventListener('click', signOutAndRedirect);
    await loadBookings(auth.session.user.id);
  })();
</script>

</body>
</html>
